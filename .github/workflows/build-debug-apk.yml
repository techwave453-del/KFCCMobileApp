name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/direct-supabase-data

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # GitHub-hosted Android runners already provide the Android SDK.
      # Do not use android-actions/setup-android here because its legacy
      # package bootstrap can request the removed "tools" package.
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          sdkmanager --version

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Install required Android SDK platform
        run: sdkmanager "platforms;android-37"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew :app:assembleDebug --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kfcc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
