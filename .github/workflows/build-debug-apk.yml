name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/direct-supabase-data

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Locate Android SDK tools
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found on the GitHub runner."
            find "$ANDROID_SDK_ROOT" -maxdepth 4 -type f \( -name sdkmanager -o -name adb \) -print || true
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"
          echo "Using sdkmanager: $SDKMANAGER"
          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "ANDROID_SDK_TOOLS=$SDKMANAGER_DIR" >> "$GITHUB_ENV"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_TOOLS/sdkmanager" --version

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_SDK_TOOLS/sdkmanager" --licenses > /dev/null || true

      - name: Install required Android SDK platform
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_TOOLS/sdkmanager" "platforms;android-37" "platform-tools"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build debug APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew :app:assembleDebug --no-configuration-cache

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: kfcc-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
