name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Kanisa release signing
        env:
          KANISA_RELEASE_KEYSTORE_BASE64: ${{ secrets.KANISA_RELEASE_KEYSTORE_BASE64 }}
          KANISA_KEYSTORE_PASSWORD: ${{ secrets.KANISA_KEYSTORE_PASSWORD }}
          KANISA_KEY_ALIAS: ${{ secrets.KANISA_KEY_ALIAS }}
          KANISA_KEY_PASSWORD: ${{ secrets.KANISA_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KANISA_RELEASE_KEYSTORE_BASE64"
          test -n "$KANISA_KEYSTORE_PASSWORD"
          test -n "$KANISA_KEY_ALIAS"
          test -n "$KANISA_KEY_PASSWORD"

          KEYSTORE_PATH="$RUNNER_TEMP/kanisa-release.jks"
          printf '%s' "$KANISA_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

          {
            echo "KANISA_KEYSTORE_PATH=$KEYSTORE_PATH"
            echo "KANISA_KEYSTORE_PASSWORD=$KANISA_KEYSTORE_PASSWORD"
            echo "KANISA_KEY_ALIAS=$KANISA_KEY_ALIAS"
            echo "KANISA_KEY_PASSWORD=$KANISA_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew :app:assembleRelease --no-configuration-cache --no-daemon

      - name: Verify release APK signature
        shell: bash
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK_PATH"

      - name: Read version from successful release output
        id: version
        shell: bash
        run: |
          test -f app/build/outputs/apk/release/output-metadata.json
          VERSION_CODE=$(jq -r '.elements[0].versionCode' app/build/outputs/apk/release/output-metadata.json)
          VERSION_NAME=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)

          test "$VERSION_CODE" != "null"
          test "$VERSION_NAME" != "null"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Release APK version: $VERSION_NAME ($VERSION_CODE)"

      - name: Upload successful release APK
        uses: actions/upload-artifact@v4
        with:
          name: kanisa-release-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Verify successful build is newer than the published release
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          PUBLISHED_CODE=$(curl --fail-with-body --silent --show-error \
            --url "$SUPABASE_URL/rest/v1/app_update_config?id=eq.android&select=version_code" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" | jq -r '.[0].version_code // 0')
          if [ "$VERSION_CODE" -le "$PUBLISHED_CODE" ]; then
            echo "Successful build versionCode $VERSION_CODE is not newer than published versionCode $PUBLISHED_CODE."
            exit 1
          fi

      - name: Record successful build in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GIT_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "$SUPABASE_URL/rest/v1/app_update_config?id=eq.android" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "{
              \"latest_build_version_code\": $VERSION_CODE,
              \"latest_build_version_name\": \"$VERSION_NAME\",
              \"latest_build_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"latest_build_commit\": \"$GIT_COMMIT\"
            }"
