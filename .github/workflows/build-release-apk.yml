name: Build Release APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: ./gradlew :app:assembleRelease --no-configuration-cache --no-daemon

      - name: Read version from successful release output
        id: version
        shell: bash
        run: |
          test -f app/build/outputs/apk/release/output-metadata.json
          VERSION_CODE=$(jq -r '.elements[0].versionCode' app/build/outputs/apk/release/output-metadata.json)
          VERSION_NAME=$(jq -r '.elements[0].versionName' app/build/outputs/apk/release/output-metadata.json)

          test "$VERSION_CODE" != "null"
          test "$VERSION_NAME" != "null"

          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "Release APK version: $VERSION_NAME ($VERSION_CODE)"

      - name: Upload successful release APK
        uses: actions/upload-artifact@v4
        with:
          name: kanisa-release-v${{ steps.version.outputs.version_name }}-${{ steps.version.outputs.version_code }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Record successful build in Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          GIT_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"

          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "$SUPABASE_URL/rest/v1/app_update_config?id=eq.android" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "{
              \"latest_build_version_code\": $VERSION_CODE,
              \"latest_build_version_name\": \"$VERSION_NAME\",
              \"latest_build_at\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",
              \"latest_build_commit\": \"$GIT_COMMIT\"
            }"
